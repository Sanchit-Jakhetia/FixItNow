spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.application.name=backend
app.seed.sample-data=true
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
app.bootstrap.admin.password=${ADMIN_PASSWORD}
app.seed.sample-data-password=${SAMPLE_DATA_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8081

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.springframework.boot.autoconfigure=ERROR
logging.level.root=WARN
logging.level.fixitnow.backend=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %msg%n